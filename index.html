<!DOCTYPE html>
<html lang="en">
<head>
    <script src="script.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Elms+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
</head>
<body>
    <div class="container">
        <h1>Tic-Tac-Toe</h1>
        <label for="player-one">Player 1 Name:</label>
        <input id="player-one">
        <label for="player-two">Player 2 Name:</label>
        <input id="player-two">
        <div class="error"></div>
        <div class="button-arranger"><span class="x-player">Player 1: </span><button class="x-button">x</button><span class="o-player">Player 2: </span><button class="o-button">o</button>
        </div>
        <div><button class="start-game-btn">Start Game</button> <button class="new-game-btn">New Game</button><span class="turn-display"></span></div>
        <div class="game-board">
        <div class="game-square"></div>
        <div class="game-square"></div>
        <div class="game-square"></div>
        <div class="game-square"></div>
        <div class="game-square"></div>
        <div class="game-square"></div>
        <div class="game-square"></div>
        <div class="game-square"></div>
        <div class="game-square"></div>
        </div>
        <div class="game-result"></div>
        <div class="player-score-div"><span class="p-one-score"></span>, <span class="p-two-score"></span></div>
    </div>
</body>
</html>
